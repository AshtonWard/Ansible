# .github/workflows/run-playbook.yml
name: Run Playbook

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: "Playbook you want to run"
        required: true
        type: choice
        options:
          - docker
          - bootstrap
          - install_wazuh_agent
          - restart_wazuh_agents
          - install_periphery
          - recover_hermes
          - install_node_exporter
      target:
        description: "VM or group to run playbook on"
        required: true
        type: string

jobs:
  run-playbook:
    if: vars.ENABLE_LAB_AUTOMATION == 'true'
    runs-on: [self-hosted, linux]

    env:
      ANSIBLE_REPO_DIR: ${{ vars.ANSIBLE_REPO_DIR }}
      TARGET: ${{ inputs.target }}
      PLAYBOOK: ${{ inputs.playbook }}

    steps:
      - name: Require an explicitly configured checkout
        shell: bash
        run: |
          test -n "$ANSIBLE_REPO_DIR" && test -d "$ANSIBLE_REPO_DIR/.git" || {
            echo "::error::Set ANSIBLE_REPO_DIR to the persistent example checkout."
            exit 1
          }
      - name: Update Ansible repository
        shell: bash
        run: |
          cd "$ANSIBLE_REPO_DIR"
          git pull --ff-only
      - name: Create Ansible Vault password
        shell: bash
        env:
          VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          umask 077
          printf '%s' "$VAULT_PASSWORD" > "$RUNNER_TEMP/vault-pass"

      - name: Verify target inventory
        working-directory: ${{ vars.ANSIBLE_REPO_DIR }}
        run: |
          ansible-inventory --host "$TARGET" --vault-password-file "$RUNNER_TEMP/vault-pass"

      - name: Run Ansible Playbook - ${{ inputs.playbook }}
        working-directory: ${{ vars.ANSIBLE_REPO_DIR }}
        shell: bash
        run: |
          ansible-playbook "playbooks/$PLAYBOOK.yml" \
            --limit "$TARGET" \
            --vault-password-file "$RUNNER_TEMP/vault-pass"

      - name: Remove Vault password
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/vault-pass"
