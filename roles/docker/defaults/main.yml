# roles/docker/defaults/main.yml
---
# defaults/main.yml is primarily a place for default variables belonging to an Ansible role.
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_service: docker
docker_service_enabled: true
docker_service_state: started


komodo_core_address: "http://komodo.lab.example.invalid:9120"

komodo_periphery_service: "periphery"
komodo_periphery_config: "/etc/komodo/periphery.config.toml"
