- name: Wait for APT to become available
  become: true
  ansible.builtin.shell: |
    while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || \
          fuser /var/lib/dpkg/lock >/dev/null 2>&1 || \
          fuser /var/cache/apt/archives/lock >/dev/null 2>&1; do
      sleep 5
    done
  changed_when: false

- name: Update APT package cache
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

# Intentionally disabled.
# A full dist upgrade can introduce package changes that may
# interfere with PowerShell or GitHub Actions dependencies.
#
# - name: Upgrade installed packages
#   become: true
#   ansible.builtin.apt:
#     upgrade: dist

- name: Install common system utilities
  become: true
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - git
      - btop
      - jq
      - unzip
      - ca-certificates
      - dnsutils
      - net-tools
      - tcpdump
      - traceroute
    state: present
  register: apt_install
  retries: 12
  delay: 10
  until: apt_install is succeeded

- name: Install PowerShell 7
  become: true
  ansible.builtin.shell: |
    apt-get update &&
    apt-get install -y wget &&
    wget -q "https://packages.microsoft.com/config/ubuntu/$(. /etc/os-release && echo $VERSION_ID)/packages-microsoft-prod.deb" &&
    dpkg -i packages-microsoft-prod.deb &&
    apt-get update &&
    apt-get install -y powershell
